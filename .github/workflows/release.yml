name: Prepare release artifacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build (for example v0.1.1)"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BUILD_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  version-check:
    name: Verify tag and release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BUILD_REF }}
          fetch-depth: 0

      - name: Verify immutable tag and versions
        id: metadata
        env:
          REQUESTED_TAG: ${{ env.BUILD_REF }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag: $REQUESTED_TAG"
            exit 1
          fi
          git show-ref --verify --quiet "refs/tags/$REQUESTED_TAG"
          TAG_COMMIT="$(git rev-list -n 1 "refs/tags/$REQUESTED_TAG")"
          HEAD_COMMIT="$(git rev-parse HEAD)"
          test "$TAG_COMMIT" = "$HEAD_COMMIT" || {
            echo "::error::Checked-out commit does not match $REQUESTED_TAG"
            exit 1
          }

          VERSION="${REQUESTED_TAG#v}"
          PACKAGE_VERSION="$(jq -r '.version' package.json)"
          CARGO_VERSION="$(awk -F '"' '/^version = / { print $2; exit }' src-tauri/Cargo.toml)"
          TAURI_VERSION="$(jq -r '.version' src-tauri/tauri.conf.json)"
          MINIMUM_MACOS="$(jq -r '.bundle.macOS.minimumSystemVersion' src-tauri/tauri.conf.json)"
          TARGETS="$(jq -c '.bundle.targets' src-tauri/tauri.conf.json)"

          test "$VERSION" = "$PACKAGE_VERSION"
          test "$VERSION" = "$CARGO_VERSION"
          test "$VERSION" = "$TAURI_VERSION"
          test "$MINIMUM_MACOS" = "13.0"
          test "$TARGETS" = '["app","dmg"]'
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  frontend:
    name: Frontend quality and dependency audit
    runs-on: macos-latest
    needs: version-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BUILD_REF }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint -- --max-warnings=0
      - run: npm run format:check
      - run: npm audit --audit-level=high
      - run: npm run build

  rust:
    name: Rust quality and tests
    runs-on: macos-latest
    needs: version-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BUILD_REF }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  security:
    name: Rust security and license audit
    runs-on: ubuntu-latest
    needs: version-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BUILD_REF }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri
      - uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: cargo-audit
          fallback: none
      - run: cargo audit --file src-tauri/Cargo.lock
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check advisories licenses sources bans

  bundled-resources:
    name: Bundled resource integrity
    runs-on: macos-latest
    needs: version-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BUILD_REF }}
      - run: bash -n scripts/*.sh
      - run: scripts/verify_bundled_resources.sh

  build:
    name: Build and verify Apple Silicon artifacts
    runs-on: macos-latest
    needs: [version-check, frontend, rust, security, bundled-resources]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BUILD_REF }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri
      - run: npm ci

      - name: Build app and DMG
        run: npm run tauri build -- --target aarch64-apple-darwin

      - name: Verify bundle architecture and legal resources
        env:
          VERSION: ${{ needs.version-check.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Burrow.app"
          test -d "$APP_DIR"

          MACHO_COUNT=0
          while IFS= read -r -d '' file_path; do
            description="$(file -b "$file_path")"
            if [[ "$description" == *"Mach-O"* ]]; then
              MACHO_COUNT=$((MACHO_COUNT + 1))
              [[ "$description" == *"arm64"* ]]
              [[ "$description" != *"x86_64"* ]]
              echo "arm64: $file_path"
            fi
          done < <(find "$APP_DIR" -type f -print0)
          test "$MACHO_COUNT" -gt 0

          for required in \
            Contents/Resources/LICENSE \
            Contents/Resources/THIRD_PARTY_NOTICES.md \
            Contents/Resources/SHA256SUMS \
            Contents/Resources/clamav/VERSION \
            Contents/Resources/clamav/SHA256SUMS \
            Contents/Resources/clamav/licenses/ClamAV-GPL-2.0-or-later.txt \
            Contents/Resources/clamav/licenses/PCRE2-BSD-3-Clause.md \
            Contents/Resources/clamav/licenses/json-c-MIT.txt \
            Contents/Resources/clamav/licenses/OpenSSL-Apache-2.0.txt \
            Contents/Resources/mole/VERSION \
            Contents/Resources/mole/SHA256SUMS \
            Contents/Resources/mole/LICENSE; do
            test -s "$APP_DIR/$required"
          done

          PLIST_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_DIR/Contents/Info.plist")"
          test "$PLIST_VERSION" = "$VERSION"

      - name: Generate CycloneDX SBOMs
        run: |
          set -euo pipefail
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          cargo cyclonedx --manifest-path src-tauri/Cargo.toml --format json --target aarch64-apple-darwin
          npm sbom --sbom-format cyclonedx > npm.cdx.json
          test -s src-tauri/burrow.cdx.json
          test -s npm.cdx.json

      - name: Assemble release artifacts and checksums
        env:
          VERSION: ${{ needs.version-check.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Burrow.app"
          DMG_DIR="src-tauri/target/aarch64-apple-darwin/release/bundle/dmg"
          SOURCE_ARCHIVE="third_party/sources/clamav-1.5.4.tar.gz"
          DIST="release-dist"
          mkdir -p "$DIST"

          DMG_COUNT="$(find "$DMG_DIR" -maxdepth 1 -type f -name '*.dmg' | wc -l | tr -d ' ')"
          test "$DMG_COUNT" -eq 1
          DMG_PATH="$(find "$DMG_DIR" -maxdepth 1 -type f -name '*.dmg' -print)"
          cp "$DMG_PATH" "$DIST/Burrow_${VERSION}_aarch64.dmg"
          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_DIR" "$DIST/Burrow_${VERSION}_aarch64.app.zip"
          cp src-tauri/burrow.cdx.json "$DIST/burrow-cargo.cdx.json"
          cp npm.cdx.json "$DIST/burrow-npm.cdx.json"
          cp "$SOURCE_ARCHIVE" "$DIST/clamav-1.5.4.tar.gz"

          (
            cd "$DIST"
            : > SHA256SUMS
            for artifact in *; do
              test "$artifact" = SHA256SUMS && continue
              shasum -a 256 "$artifact" >> SHA256SUMS
            done
            test -s SHA256SUMS
          )

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: burrow-${{ needs.version-check.outputs.version }}-macos-arm64
          retention-days: 30
          if-no-files-found: error
          path: release-dist/
