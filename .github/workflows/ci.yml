name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (TypeScript + ESLint)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint src --max-warnings=0

      - name: Prettier
        run: npx prettier --check "src/**/*.{ts,tsx,css}"

      - name: npm audit
        run: npm audit --audit-level=high

      - name: Production build
        run: npm run build

  rust:
    name: Rust (check + clippy + test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: cargo fmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  version-consistency:
    name: Version consistency (package.json / Cargo.toml / tauri.conf.json)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check versions match
        run: |
          PKG=$(jq -r '.version' package.json)
          CARGO=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/version *= *"\(.*\)"/\1/')
          TAURI=$(jq -r '.version' src-tauri/tauri.conf.json)
          echo "package.json : ${PKG}"
          echo "Cargo.toml   : ${CARGO}"
          echo "tauri.conf   : ${TAURI}"
          if [ "$PKG" != "$CARGO" ] || [ "$PKG" != "$TAURI" ]; then
            echo "::error::Version mismatch — all three files must agree"
            exit 1
          fi

      - name: Check minimumSystemVersion is 13.0
        run: |
          MIN=$(jq -r '.bundle.macOS.minimumSystemVersion' src-tauri/tauri.conf.json)
          if [ "$MIN" != "13.0" ]; then
            echo "::error::minimumSystemVersion is '${MIN}', expected '13.0'"
            exit 1
          fi

  repository-hygiene:
    name: Workflow and secret-history checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install verified audit tools
        shell: bash
        run: |
          set -euo pipefail
          actionlint_dir="$RUNNER_TEMP/actionlint"
          gitleaks_dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$actionlint_dir" "$gitleaks_dir"

          curl --proto '=https' --proto-redir '=https' --fail --show-error --location --retry 3 \
            --output "$actionlint_dir/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $actionlint_dir/actionlint.tar.gz" \
            | sha256sum --check
          tar -xzf "$actionlint_dir/actionlint.tar.gz" -C "$actionlint_dir"

          curl --proto '=https' --proto-redir '=https' --fail --show-error --location --retry 3 \
            --output "$gitleaks_dir/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $gitleaks_dir/gitleaks.tar.gz" \
            | sha256sum --check
          tar -xzf "$gitleaks_dir/gitleaks.tar.gz" -C "$gitleaks_dir"

          "$actionlint_dir/actionlint" .github/workflows/*.yml
          "$gitleaks_dir/gitleaks" git . --redact --no-banner

  bundled-resources:
    name: Bundled resources (arm64 + checksums)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate shell scripts
        run: bash -n scripts/*.sh

      - name: Verify bundled resources
        run: scripts/verify_bundled_resources.sh

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install cargo-audit
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: cargo-audit
          fallback: none

      - name: cargo audit
        run: cargo audit --file src-tauri/Cargo.lock

      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check advisories licenses sources bans

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked

      - name: Generate SBOM
        run: |
          cargo cyclonedx --manifest-path src-tauri/Cargo.toml --format json --target aarch64-apple-darwin
          npm sbom --sbom-format cyclonedx > npm.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: |
            src-tauri/*.cdx.json
            npm.cdx.json
