name: Bug report
description: Report a reproducible Burrow problem on Apple Silicon.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Burrow. Remove personal paths, usernames and other private data from logs before attaching them.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Choose …
        3. Observe …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Burrow version or commit
      placeholder: v0.2.2 or a later version/commit
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 26.5 or macOS 15.7
    validations:
      required: true
  - type: dropdown
    id: chip
    attributes:
      label: Apple Silicon chip
      options:
        - M1 family
        - M2 family
        - M3 family
        - M4 family
        - Other Apple Silicon
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Optional. Do not include secrets, personal data or full private paths.
  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I removed secrets and personal data from this report.
          required: true
        - label: This is not a security vulnerability.
          required: true
